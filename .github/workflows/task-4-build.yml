name: Task 4 Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - "task-4-ecommerce-cart/**"
      - ".github/workflows/task-4-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-4-ecommerce-cart
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript and production build
        run: npm run build